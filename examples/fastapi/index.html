<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sllurp RFID Reader Control</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .button-group { margin: 20px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 8px 16px; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 4px; overflow: auto; }
        .connection-status { padding: 5px 10px; border-radius: 4px; display: inline-block; }
        .connected { background: #4caf50; color: white; }
        .disconnected { background: #f44336; color: white; }
    </style>
</head>
<body>
    <h2>Sllurp RFID Reader Control</h2>
    <div id="wsStatus" class="connection-status disconnected">WebSocket: Disconnected</div>
    <div class="button-group">
        <button onclick="postAction('/start')">Start Reader</button>
        <button onclick="postAction('/stop')">Stop Reader</button>
        <button onclick="getTags()">Get Tags</button>
        <button onclick="postAction('/clear', true)">Clear Tags</button>
        <button onclick="showJson('/state')">Show State</button>
        <button onclick="showJson('/status')">Show Status</button>
    </div>
    <h3>Tag Data</h3>
    <pre id="tagList">No tags yet...</pre>

    <script>
        let ws;

        function connectWebSocket() {
            const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${scheme}://${window.location.host}/ws`);
            ws.onopen = () => setWsStatus(true);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('tagList').innerText = JSON.stringify(data.tags, null, 2);
            };
            ws.onclose = () => {
                setWsStatus(false);
                setTimeout(connectWebSocket, 5000);
            };
            ws.onerror = (error) => console.error('WebSocket error:', error);
        }

        function setWsStatus(connected) {
            const element = document.getElementById('wsStatus');
            element.textContent = `WebSocket: ${connected ? 'Connected' : 'Disconnected'}`;
            element.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
        }

        async function postAction(path, clearDisplay = false) {
            try {
                const response = await fetch(path, {method: 'POST'});
                const data = await response.json();
                if (clearDisplay) document.getElementById('tagList').innerText = 'No tags yet...';
                alert(JSON.stringify(data));
            } catch (error) {
                console.error(`Request failed for ${path}:`, error);
            }
        }

        async function getTags() {
            const response = await fetch('/last-read');
            const data = await response.json();
            document.getElementById('tagList').innerText = JSON.stringify(data.tags, null, 2);
        }

        async function showJson(path) {
            const response = await fetch(path);
            const data = await response.json();
            alert(JSON.stringify(data, null, 2));
        }

        window.addEventListener('load', connectWebSocket);
    </script>
</body>
</html>
