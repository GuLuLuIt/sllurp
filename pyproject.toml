[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sllurp"
dynamic = ["version"]
description = "Production-focused Python client and toolkit for LLRP RFID readers"
readme = "README.rst"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Ben Ransford", email = "ben@ransford.org" },
]
maintainers = [
    { name = "GuLuLuIt" },
]
keywords = ["llrp", "rfid", "reader", "uhf", "epc", "inventory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "hypothesis",
]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "bandit",
    "codespell",
    "build",
    "twine",
]

[project.scripts]
sllurp = "sllurp.cli:cli"

[project.urls]
Homepage = "https://github.com/GuLuLuIt/sllurp"
Repository = "https://github.com/GuLuLuIt/sllurp"
Documentation = "https://github.com/GuLuLuIt/sllurp/blob/main/QUICKSTART.md"
Examples = "https://github.com/GuLuLuIt/sllurp/tree/main/examples"
Changelog = "https://github.com/GuLuLuIt/sllurp/blob/main/CHANGELOG.md"
Contributing = "https://github.com/GuLuLuIt/sllurp/blob/main/CONTRIBUTING.md"
Security = "https://github.com/GuLuLuIt/sllurp/blob/main/SECURITY.md"
Support = "https://github.com/GuLuLuIt/sllurp/blob/main/SUPPORT.md"
Upstream = "https://github.com/sllurp/sllurp"

[tool.setuptools.packages.find]
include = ["sllurp*"]

[tool.setuptools.dynamic]
version = {attr = "sllurp.version.__version__"}
