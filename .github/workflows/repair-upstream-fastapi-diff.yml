name: Repair upstream FastAPI diff

on:
  push:
    branches:
      - upstream/fix-audit-protocol-cli-2026-09-14

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upstream/fix-audit-protocol-cli-2026-09-14
          fetch-depth: 0
      - name: Restore original bytes and patch shutdown only
        run: |
          git checkout 28a3b240babcd58b1645c33412179e9a03876735 -- examples/fastapi/app.py
          python - <<'PY'
          from pathlib import Path
          path = Path('examples/fastapi/app.py')
          data = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in data else b'\n'
          old_calls = b'                READER.llrp.stopPolitely()' + nl + b'                READER.disconnect()'
          new_calls = (
              b'                READER.disconnect(timeout=2)' + nl
              + b'                if READER.is_alive():' + nl
              + b'                    READER.hard_disconnect()' + nl
              + b'                    READER.join(1)'
          )
          if data.count(old_calls) != 1:
              raise SystemExit(f'expected one shutdown call pair, found {data.count(old_calls)}')
          data = data.replace(old_calls, new_calls, 1)
          old_error = b'                logging.error(f"Error during reader shutdown: {e}")'
          new_error = old_error + nl + b'                READER.hard_disconnect()'
          if data.count(old_error) != 1:
              raise SystemExit(f'expected one shutdown error line, found {data.count(old_error)}')
          path.write_bytes(data.replace(old_error, new_error, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/fastapi/app.py
          git commit -m 'Preserve FastAPI example line endings'
          git push origin HEAD:upstream/fix-audit-protocol-cli-2026-09-14
