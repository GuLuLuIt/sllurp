name: Post runtime hardening

on:
  push:
    branches:
      - feature/finish-software-todos-2026-09-11

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install test dependencies
        run: pip install -e .[test]
      - name: Apply failure-path hardening
        run: python tools/_post_runtime_hardening.py
      - name: Run full suite before commit
        run: pytest
      - name: Commit tested result
        run: |
          git config user.name "GuLuLuIt"
          git config user.email "lini10011001@gmail.com"
          git add -A
          git commit -m "Harden runtime failure transitions"
          git push
