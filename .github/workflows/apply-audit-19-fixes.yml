name: Apply audit 19 fixes

on:
  push:
    branches:
      - fix/remaining-audit-bugs-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/remaining-audit-bugs-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply exact replacements
        run: python tools/apply_audit_19_fixes.py
      - name: Commit patched tree
        run: |
          rm tools/apply_audit_19_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix all 19 repository audit findings'
          git push origin HEAD:fix/remaining-audit-bugs-2026-09-14
