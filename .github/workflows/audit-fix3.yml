name: Complete repository audit fixes

on:
  push:
    branches: [audit/full-repo-sanity-2026-09-11]
    paths: [.github/workflows/audit-fix3.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-repo-sanity-2026-09-11
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Reuse proven patch step
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess
          import yaml
          with open('.github/workflows/audit-fix2.yml') as f:
              workflow = yaml.safe_load(f)
          step = next(s for s in workflow['jobs']['fix']['steps'] if s.get('name') == 'Apply proven fixes')
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', step['run']], check=True)
          PY
      - name: Remove remaining stale locals
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sllurp/llrp_proto.py')
          text = p.read_text().replace('                decode_error_reason = e.get("DecodeError")\n', '')
          p.write_text(text)
          p = Path('tests/test_all.py')
          text = p.read_text().replace('        rospec_str = repr(rospec)\n', '')
          p.write_text(text)
          Path('.github/workflows/audit-fix3.yml').unlink(missing_ok=True)
          PY
      - name: Safe stale-import cleanup
        run: |
          python -m pip install ruff
          ruff check sllurp tests examples --select F401,F841,I001 --fix
      - name: Install project and audit tools
        run: |
          python -m pip install -e '.[test]'
          python -m pip install bandit build twine
      - name: Full validation
        run: |
          python -m compileall -q sllurp tests examples
          pytest -q -W error
          ruff check sllurp tests examples --select E9,F63,F7,F82,F401,F841,E722,B006,ISC004,B017
          bandit -r sllurp -q
          python -m build
          twine check dist/*
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix repository audit findings'
          git push origin HEAD:audit/full-repo-sanity-2026-09-11
