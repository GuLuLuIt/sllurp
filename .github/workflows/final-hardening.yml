name: Final hardening patch

on:
  push:
    branches: [fix/final-hardware-readiness]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Apply audited hardening changes
        run: |
          sed -i 's/count=2,/count=3,/' tools/final_hardening.py
          python tools/final_hardening.py
      - name: Apply compatibility and sanity follow-ups
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count}, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Keep direct verb.main() callers compatible with pre-flag Args objects.
          for path in (
              "sllurp/verb/inventory.py",
              "sllurp/verb/log.py",
              "sllurp/verb/access.py",
          ):
              replace(
                  path,
                  "impinj_fixed_frequency=args.impinj_fixed_frequency,",
                  'impinj_fixed_frequency=getattr(args, "impinj_fixed_frequency", False),',
              )

          # The legacy dynamic-command fixtures deliberately exercise automatic
          # frequency selection, which is an Impinj vendor extension. Make that
          # opt-in explicit instead of weakening production validation.
          replace(
              "tests/test_dynamic_commands.py",
              '''        hoptable_id=1,\n        **tls_args(),\n''',
              '''        hoptable_id=1,\n        impinj_fixed_frequency=True,\n        **tls_args(),\n''',
              count=3,
          )

          # A session reset is internal bookkeeping; don't emit a duplicate state callback.
          replace(
              "sllurp/llrp.py",
              '''        if self.llrp:\n            self.llrp._deferreds.clear()\n            self.llrp.rospec = None\n            self.llrp.disconnecting = False\n            self.llrp.setState(LLRPReaderState.STATE_DISCONNECTED)\n''',
              '''        if self.llrp:\n            self.llrp._deferreds.clear()\n            self.llrp.rospec = None\n            self.llrp.disconnecting = False\n            self.llrp.state = LLRPReaderState.STATE_DISCONNECTED\n''',
          )

          # Avoid the Python 3.14 utcnow deprecation in a long-running logger.
          replace(
              "sllurp/verb/log.py",
              '''                timestamp = (\n                    datetime.datetime.utcnow() - datetime.datetime(1970, 1, 1)\n                ).total_seconds()\n''',
              '''                timestamp = datetime.datetime.now(\n                    datetime.timezone.utc\n                ).timestamp()\n''',
          )

          # Streaming CSV is intentional: verify emitted data instead of an in-memory cache.
          replace(
              "tests/test_dynamic_commands.py",
              '''    assert logger.num_tags == 3\n    assert len(logger.rows) == 1\n    assert logger.rows[0][:4] == (2.0, "reader-a:5084", 2, -40)\n    assert "wanted" in output.getvalue()\n    assert "ignored" not in output.getvalue()\n''',
              '''    assert logger.num_tags == 3\n    assert not hasattr(logger, "rows")\n    assert "2.0,reader-a:5084,2,-40,wanted" in output.getvalue()\n    assert "ignored" not in output.getvalue()\n''',
          )

          # Integer dBm is a valid numeric API input; normalize it just like float input.
          replace(
              "tests/test_llrp_objects.py",
              '''    with pytest.raises(LLRPError, match="tx_power must be dict or float"):\n        client_config(tx_power_dbm=10)\n\n    config = client_config(antennas=[1, 2], tx_power_dbm=12.5)\n''',
              '''    int_config = client_config(tx_power_dbm=10)\n    assert int_config.tx_power_dbm == {1: 10.0}\n\n    config = client_config(antennas=[1, 2], tx_power_dbm=12.5)\n''',
          )

          # Capability validation already treats MaxTari as inclusive; ROSpec generation must match.
          replace(
              "tests/test_rospec_dynamic.py",
              '''def test_rospec_tari_at_or_above_mode_max_is_not_overridden():\n    mode = {"ModeIdentifier": 7, "MinTari": 10, "MaxTari": 20}\n    rospec = LLRPROSpec(mode, 1, tari=20)\n\n    control = _antenna_configs(rospec)[0]["C1G2InventoryCommand"][0]["C1G2RFControl"]\n    assert control == {"ModeIndex": 7, "Tari": 0}\n''',
              '''def test_rospec_tari_at_mode_max_is_overridden_but_above_max_is_not():\n    mode = {"ModeIdentifier": 7, "MinTari": 10, "MaxTari": 20}\n    rospec = LLRPROSpec(mode, 1, tari=20)\n    control = _antenna_configs(rospec)[0]["C1G2InventoryCommand"][0]["C1G2RFControl"]\n    assert control == {"ModeIndex": 7, "Tari": 20}\n\n    rospec = LLRPROSpec(mode, 1, tari=21)\n    control = _antenna_configs(rospec)[0]["C1G2InventoryCommand"][0]["C1G2RFControl"]\n    assert control == {"ModeIndex": 7, "Tari": 0}\n''',
          )
          PY
      - name: Install test/build dependencies
        run: python -m pip install -e '.[test]' build
      - name: Check Python syntax
        run: python -m compileall -q sllurp tests
      - name: Check whitespace
        run: git diff --check
      - name: Run full test suite
        run: pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-test wheel in clean environment
        run: |
          python -m venv /tmp/sllurp-final-smoke
          /tmp/sllurp-final-smoke/bin/pip install dist/sllurp-*.whl
          /tmp/sllurp-final-smoke/bin/python -c "import sllurp; import sllurp.cli; import sllurp.llrp; import sllurp.zebra_management"
          /tmp/sllurp-final-smoke/bin/sllurp --help >/dev/null
      - name: Commit validated patch
        run: |
          git rm tools/final_hardening.py .github/workflows/final-hardening.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden final hardware-readiness edge cases"
          git push origin HEAD:fix/final-hardware-readiness
