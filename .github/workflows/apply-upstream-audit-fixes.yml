name: Apply upstream audit fixes

on:
  push:
    branches:
      - upstream/fix-audit-protocol-cli-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: upstream/fix-audit-protocol-cli-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Apply exact replacements
        run: python tools/apply_upstream_audit_fixes.py
      - name: Commit patched tree
        run: |
          rm tools/apply_upstream_audit_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix inherited LLRP protocol and CLI audit defects'
          git push origin HEAD:upstream/fix-audit-protocol-cli-2026-09-14
