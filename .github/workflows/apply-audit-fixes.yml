name: Apply audited fixes

on:
  push:
    branches: [audit/correctness-fixes-1]
    paths:
      - scripts/apply_audit_fixes.py
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/correctness-fixes-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply guarded fixes
        run: python scripts/apply_audit_fixes.py
      - name: Install test dependencies
        run: python -m pip install -e .[test]
      - name: Run regression and existing tests
        run: pytest
      - name: Build and smoke-test wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/sllurp-wheel-test
          /tmp/sllurp-wheel-test/bin/pip install dist/sllurp-*.whl
          /tmp/sllurp-wheel-test/bin/python -c "import sllurp; import sllurp.epc; import sllurp.verb.inventory; import sllurp.cli"
          /tmp/sllurp-wheel-test/bin/sllurp --help >/dev/null
      - name: Commit verified fixes
        run: |
          rm scripts/apply_audit_fixes.py .github/workflows/apply-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sllurp/llrp.py sllurp/llrp_proto.py sllurp/cli.py pyproject.toml scripts/apply_audit_fixes.py .github/workflows/apply-audit-fixes.yml
          git commit -m "Fix audited protocol, state, CLI, and packaging bugs"
          git push origin HEAD:audit/correctness-fixes-1
