name: Apply upstream IPv6 address-resolution fix

on:
  push:
    branches:
      - upstream/fix-ipv6-address-resolution

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/fix-ipv6-address-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch and test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sllurp/llrp.py')
          text = path.read_text()
          text = text.replace('    AF_INET,\n', '', 1)
          text = text.replace('    SOCK_STREAM,\n', '', 1)
          text = text.replace('    socket,\n', '    create_connection,\n', 1)
          old = '''            self._socket = socket(AF_INET, SOCK_STREAM)
            # Sllurp original timeout is 3s
            self._socket.settimeout(self._socktimeout)
            self._socket.connect((self._host, self._port))
'''
          new = '''            self._socket = create_connection(
                (self._host, self._port), timeout=self._socktimeout
            )
            # Preserve the configured timeout after connection establishment.
            self._socket.settimeout(self._socktimeout)
'''
          if old not in text:
              raise SystemExit('connection target not found')
          path.write_text(text.replace(old, new, 1))
          Path('tests/test_address_resolution.py').write_text('''import sllurp.llrp as llrp_module\nfrom sllurp.llrp import LLRPReaderClient\n\n\nclass FakeSocket:\n    def __init__(self):\n        self.options = []\n        self.timeout = None\n    def setsockopt(self, *args):\n        self.options.append(args)\n    def settimeout(self, value):\n        self.timeout = value\n\n\ndef test_reader_client_uses_resolver_aware_create_connection(monkeypatch):\n    calls = []\n    sock = FakeSocket()\n    def fake_create_connection(address, timeout):\n        calls.append((address, timeout))\n        return sock\n    monkeypatch.setattr(llrp_module, "create_connection", fake_create_connection)\n    reader = LLRPReaderClient("reader.example", 5084, timeout=2.5)\n    reader._connect_socket()\n    assert calls == [(("reader.example", 5084), 2.5)]\n    assert reader._socket is sock\n''')
          PY
          python -m pip install -e . pytest
          pytest -q tests/test_address_resolution.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-upstream-ipv6.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use resolver-aware LLRP connections"
          git push origin HEAD:upstream/fix-ipv6-address-resolution
