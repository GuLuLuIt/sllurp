name: Apply FXR90 support

on:
  push:
    branches: [feature/fxr90-support]
    paths:
      - scripts/apply_fxr90_support.py
      - .github/workflows/apply-fxr90-support.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fxr90-support
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply guarded FXR90 changes
        run: python scripts/apply_fxr90_support.py
      - name: Install test dependencies
        run: python -m pip install -e .[test]
      - name: Run full test suite
        run: pytest
      - name: Build and smoke-test wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          python -m venv /tmp/sllurp-fxr90-wheel-test
          /tmp/sllurp-fxr90-wheel-test/bin/pip install dist/sllurp-*.whl
          /tmp/sllurp-fxr90-wheel-test/bin/python -c "from sllurp.llrp import LLRPReaderConfig, LLRPReaderClient; c=LLRPReaderConfig({'tls_enabled': True}); r=LLRPReaderClient('reader.example', config=c); assert c.tls_verify"
          /tmp/sllurp-fxr90-wheel-test/bin/sllurp inventory --help | grep -- '--tls'
      - name: Commit verified implementation
        run: |
          rm scripts/apply_fxr90_support.py .github/workflows/apply-fxr90-support.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sllurp/llrp.py sllurp/cli.py sllurp/verb/inventory.py sllurp/verb/log.py sllurp/verb/access.py sllurp/verb/reset.py README.rst scripts/apply_fxr90_support.py .github/workflows/apply-fxr90-support.yml
          git commit -m "Add Zebra FXR90 secure LLRP support"
          git push origin HEAD:feature/fxr90-support
