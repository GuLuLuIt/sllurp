name: Apply ROSpec validation fix

on:
  push:
    branches: [test/dynamic-coverage]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/dynamic-coverage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply guarded validation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sllurp/llrp_proto.py')
          text = path.read_text()
          old = '        freq_channel_list = frequencies.get("ChannelList", [DEFAULT_CHANNEL_INDEX])\n        # patch up per-antenna config\n'
          new = '        freq_channel_list = frequencies.get("ChannelList", [DEFAULT_CHANNEL_INDEX])\n        if not freq_channel_list:\n            raise LLRPError("ChannelList must contain at least one channel")\n        # patch up per-antenna config\n'
          assert old in text, 'ROSpec ChannelList target not found'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: pip install -e '.[test]'
      - name: Verify focused and full tests
        run: |
          pytest tests/test_rospec_dynamic.py
          pytest
      - name: Commit verified fix
        run: |
          rm .github/workflows/apply-rospec-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sllurp/llrp_proto.py .github/workflows/apply-rospec-validation.yml
          git commit -m 'Validate empty ROSpec channel lists'
          git push origin HEAD:test/dynamic-coverage
