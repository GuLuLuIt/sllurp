name: Build release distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os
          from sllurp.version import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{__version__}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {__version__!r}; "
                  f"expected {expected!r}."
              )
          print(f"Release tag {tag} matches package version {__version__}.")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify built artifact version
        run: |
          python - <<'PY'
          from pathlib import Path
          from sllurp.version import __version__

          artifacts = [path.name for path in Path("dist").iterdir()]
          expected_prefix = f"sllurp-{__version__}"
          if not artifacts or not all(name.startswith(expected_prefix) for name in artifacts):
              raise SystemExit(
                  f"Built artifacts {artifacts!r} do not all match {expected_prefix!r}."
              )
          print(f"Validated release artifacts: {artifacts}")
          PY
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum sllurp-*.whl sllurp-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release distributions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/sllurp-*.whl
            dist/sllurp-*.tar.gz
      - name: Upload validated distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish downloadable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/sllurp-*.whl \
              dist/sllurp-*.tar.gz \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Sllurp $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/sllurp-*.whl \
              dist/sllurp-*.tar.gz \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Sllurp $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
