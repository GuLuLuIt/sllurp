name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    env:
      cache-revision: 3
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest -W error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run branch coverage
        run: pytest --cov=sllurp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=65

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/sllurp-wheel-test
          /tmp/sllurp-wheel-test/bin/pip install dist/sllurp-*.whl
      - name: Smoke-test installed package
        run: |
          /tmp/sllurp-wheel-test/bin/python -c "import sllurp; import sllurp.epc; import sllurp.verb.inventory; import sllurp.cli"
          /tmp/sllurp-wheel-test/bin/sllurp --help >/dev/null

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install quality tools
        run: python -m pip install -e '.[dev]'
      - name: Compile all Python
        run: python -m compileall -q sllurp tests examples
      - name: High-signal static checks
        run: ruff check sllurp tests examples --select E9,F63,F7,F82,F401,F841,E722,B006,ISC004,B017
      - name: Security checks
        run: bandit -r sllurp -q
