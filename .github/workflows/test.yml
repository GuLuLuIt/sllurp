name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    env:
      cache-revision: 3
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest -W error

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify CLI
        run: |
          sllurp --version
          sllurp --help
      - name: Run tests
        run: pytest -W error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -e '.[test]'
      - name: Run branch coverage
        run: pytest --cov=sllurp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=65

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/sllurp-wheel-test
          /tmp/sllurp-wheel-test/bin/pip install dist/sllurp-*.whl
      - name: Check wheel dependency consistency
        run: /tmp/sllurp-wheel-test/bin/pip check
      - name: Smoke-test installed package
        run: |
          /tmp/sllurp-wheel-test/bin/python -c "import sllurp; import sllurp.epc; import sllurp.verb.inventory; import sllurp.cli; import sllurp.entrypoint"
          /tmp/sllurp-wheel-test/bin/sllurp --version
          /tmp/sllurp-wheel-test/bin/sllurp --help >/dev/null

  fastapi-example:
    name: fastapi-example (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install repository and FastAPI example dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install -r examples/fastapi/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import FastAPI example without reader hardware
        run: python -c "import runpy; ns = runpy.run_path('examples/fastapi/app.py'); assert ns['app']; assert ns['INDEX_PATH'].is_file(); assert ns['TAG_QUEUE'].maxsize == 1"
      - name: Test FastAPI shutdown lifecycle
        run: pytest -W error tests/test_audit_behavior.py -k fastapi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install quality tools
        run: python -m pip install -e '.[dev]'
      - name: Compile all Python
        run: python -m compileall -q sllurp tests examples
      - name: High-signal static checks
        run: ruff check sllurp tests examples --select E9,F63,F7,F82,F401,F841,E722,B006,ISC004,B017
      - name: Security checks
        run: bandit -r sllurp -q
