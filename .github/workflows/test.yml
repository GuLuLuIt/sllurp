name: Test

on: [push, pull_request, workflow_dispatch]

jobs:
  apply-core-hardware-readiness:
    if: github.ref == 'refs/heads/fix/core-hardware-readiness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited maintenance patch
        run: python tools/apply_core_hardware_readiness.py
      - name: Commit maintenance patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sllurp/llrp.py sllurp/secure.py sllurp/zebra_management.py tests/test_regressions.py tests/test_secure.py tests/test_zebra_management.py
          git diff --cached --check
          git commit -m "Fix remaining hardware-readiness regressions"
          git push

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    env:
      cache-revision: 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: pip3 install -e .[test]
      - name: Run tests
        run: pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: pip3 install -e .[test]
      - name: Run branch coverage
        run: pytest --cov=sllurp --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=65

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/sllurp-wheel-test
          /tmp/sllurp-wheel-test/bin/pip install dist/sllurp-*.whl
      - name: Smoke-test installed package
        run: |
          /tmp/sllurp-wheel-test/bin/python -c "import sllurp; import sllurp.epc; import sllurp.verb.inventory; import sllurp.cli"
          /tmp/sllurp-wheel-test/bin/sllurp --help >/dev/null
