name: Patch IPv6 address resolution

on:
  push:
    branches: [fix/ipv6-address-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ipv6-address-resolution
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python .github/patch_ipv6.py
      - run: python -m pip install -e '.[test,dev]'
      - run: pytest -q tests/test_address_resolution.py
      - run: ruff check sllurp/llrp.py sllurp/secure.py tests/test_address_resolution.py --select F401,F841,E9
      - run: |
          rm .github/patch_ipv6.py
          rm .github/workflows/patch-ipv6-address-resolution.yml
          rm .github/workflows/patch-ipv6-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use resolver-aware LLRP connections"
          git push origin HEAD:fix/ipv6-address-resolution
