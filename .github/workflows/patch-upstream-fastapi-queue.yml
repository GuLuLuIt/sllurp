name: Apply upstream FastAPI queue fix

on:
  push:
    branches:
      - upstream/fix-fastapi-bounded-tag-queue

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/fix-fastapi-bounded-tag-queue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch and syntax-check
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('examples/fastapi/app.py')
          text = path.read_text()
          text = text.replace('from queue import Queue', 'from queue import Empty, Full, Queue', 1)
          text = text.replace('TAG_QUEUE = Queue()', 'TAG_QUEUE = Queue(maxsize=1)', 1)
          marker = 'ACTIVE_CONNECTIONS = []\n\n\nasync def process_queue():'
          helper = '''ACTIVE_CONNECTIONS = []\n\n\ndef _publish_latest_tags(tags):\n    """Queue the newest batch without allowing an unbounded backlog."""\n    while True:\n        try:\n            TAG_QUEUE.put_nowait(tags)\n            return\n        except Full:\n            try:\n                TAG_QUEUE.get_nowait()\n            except Empty:\n                continue\n\n\nasync def process_queue():'''
          if marker not in text:
              raise SystemExit('queue helper insertion target not found')
          text = text.replace(marker, helper, 1)
          old = '    TAG_QUEUE.put(serializable_tags)'
          if old not in text:
              raise SystemExit('queue put target not found')
          text = text.replace(old, '    _publish_latest_tags(serializable_tags)', 1)
          path.write_text(text)
          PY
          python -m compileall -q examples/fastapi/app.py
      - name: Commit patch
        run: |
          rm .github/workflows/patch-upstream-fastapi-queue.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bound FastAPI tag update queue"
          git push origin HEAD:upstream/fix-fastapi-bounded-tag-queue
