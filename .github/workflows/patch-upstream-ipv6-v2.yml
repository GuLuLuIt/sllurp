name: Patch upstream IPv6 address resolution

on:
  push:
    branches: [upstream/fix-ipv6-address-resolution]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream/fix-ipv6-address-resolution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/patch_upstream_ipv6.py
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_address_resolution.py
      - run: |
          rm .github/patch_upstream_ipv6.py
          rm .github/workflows/patch-upstream-ipv6.yml
          rm .github/workflows/patch-upstream-ipv6-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use resolver-aware LLRP connections"
          git push origin HEAD:upstream/fix-ipv6-address-resolution
