name: Bug report
description: Report a reproducible Sllurp defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, private keys,
        production addresses, and customer or tag data before submitting.
  - type: input
    id: version
    attributes:
      label: Sllurp version
      description: Run `sllurp --version` and paste the result.
      placeholder: sllurp, version 3.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and installation method
      placeholder: Python 3.13, Windows 11, v3.1.2 wheel
    validations:
      required: true
  - type: input
    id: reader
    attributes:
      label: Reader model and firmware
      description: Include this when the problem involves reader behavior.
      placeholder: Vendor model, firmware version, LLRP or TLS port
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe command, configuration, or code sample.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Attach relevant DEBUG output after removing sensitive data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested the maintained 3.1.2 release or current main branch.
          required: true
        - label: I removed credentials, private keys, addresses, and customer or tag data.
          required: true
        - label: This is not a security vulnerability.
          required: true
