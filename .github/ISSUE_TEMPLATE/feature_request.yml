name: Feature request
description: Propose a supported workflow or interoperability improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe the operator or developer problem to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired API, command, or documented workflow.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant reader model and firmware
      description: Leave blank if the request is not hardware-specific.
  - type: textarea
    id: references
    attributes:
      label: Protocol or vendor documentation
      description: Link stable specifications for protocol- or vendor-specific behavior.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the 3.1.2 user guide, developer guide, and existing issues.
          required: true
        - label: This request does not depend on an undocumented private endpoint.
          required: true
